name: frontend
description: "ATS CV Tester - A modern Flutter application for CV analysis"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # HTTP & API
  http: ^1.3.0
  dio: ^5.7.0
  
  # File handling
  file_picker: ^8.3.7
  
  # Storage
  flutter_secure_storage: ^10.0.0-beta.4
  shared_preferences: ^2.3.3
  
  # JSON
  json_annotation: ^4.9.0
  
  # Path & sharing
  path_provider: ^2.1.1
  share_plus: ^7.1.0
  url_launcher: ^6.1.14
  
  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  
  # Media
  video_player: ^2.9.2
  audioplayers: ^6.1.1
  
  # Utilities
  language_detector: ^1.0.1
  percent_indicator: ^4.2.5 
  fl_chart: ^0.65.0
  lottie: ^3.3.1
  dotted_border: ^2.1.0
  intl: ^0.20.2
  
  # Routing
  go_router: ^14.6.2
  
  # Dependency Injection
  get_it: ^8.0.2
  
  # Error handling & logging
  logger: ^2.4.0
  
  # Caching
  cached_network_image: ^3.4.1
  
  # Responsive design
  responsive_framework: ^1.5.1
  
  # Animations
  flutter_animate: ^4.5.2
  
  # Form validation
  form_validator: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  flutter_lints: ^5.0.0
  mockito: ^5.4.5
  
  # Testing
  integration_test:
    sdk: flutter
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - lib/assets/images/
    - lib/assets/videos/
    - lib/assets/animations/


